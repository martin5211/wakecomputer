[package]
name = "wakecomputer"
version = "0.1.0"
edition = "2024"
description = "Wake-on-LAN and shutdown server for Amazon Alexa"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
thiserror = "2"

[package.metadata.deb]
maintainer = "Martin <martin@localhost>"
copyright = "2026 Martin"
section = "net"
priority = "optional"
conf-files = ["/etc/wakecomputer/config.yaml"]
assets = [
    ["target/release/wakecomputer", "usr/bin/", "755"],
    ["config.yaml", "etc/wakecomputer/config.yaml", "644"],
]
systemd-units = { enable = true }
